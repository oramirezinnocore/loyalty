services:
  db:
    image: postgres:16-alpine
    container_name: loyalty-postgres
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: loyalty
    volumes:
      - loyalty-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loyalty-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://loyalty:${DB_PASSWORD}@db:5432/loyalty
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY}
    volumes:
      # Persistent uploads volume - survives container recreation and deployments
      - loyalty-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # PostgreSQL data - EXISTING PRODUCTION VOLUME
  # Using external: true prevents project-name prefixing (loyalty_loyalty-postgres-data)
  # This preserves the authoritative production database
  loyalty-postgres-data:
    external: true
    name: loyalty-postgres-data

  # User uploads (business logos) - NEW persistent volume
  # Using external: false with explicit name for stable identity
  loyalty-uploads:
    name: loyalty-uploads
