version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: loyalty
    volumes:
      - loyalty-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://loyalty:${DB_PASSWORD}@db:5432/loyalty
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY}
    volumes:
      # Persistent uploads volume - survives container recreation and deployments
      - loyalty-uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

volumes:
  # PostgreSQL data - NEVER delete with -v flag
  loyalty-postgres-data:
  # User uploads (business logos) - NEVER delete with -v flag
  loyalty-uploads:
